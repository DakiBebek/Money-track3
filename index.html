<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duitku</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#3956f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duitku">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#151a30;--mute:#7c85a3;--line:#e4e8f5;--main:#3956f5;--main2:#2540d6;--in:#1fa15c;--out:#e5533d;--hero1:#3956f5;--hero2:#2135b8;--hero-ink:#fff;--hero-mute:rgba(255,255,255,.75);--hero-chip:rgba(255,255,255,.14);--hero-border:none;--font:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0d1020;--card:#161b34;--ink:#eef0fb;--mute:#8992b8;--line:#262c4c;--main:#5b7bff;--main2:#3956f5;--in:#33c281;--out:#ff6b53;--hero1:#2135b8;--hero2:#131f80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);padding-bottom:86px}
main{max-width:640px;margin:0 auto}
h1{font-size:22px;font-weight:800;margin:0 0 14px;padding:16px 0 0}
h2{font-size:15px;font-weight:700;margin:18px 16px 8px}
.wrap{padding:0 16px}
.card{background:var(--card);border:0;box-shadow:0 1px 3px rgba(0,0,0,.07);border-radius:18px;padding:18px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mute{color:var(--mute);font-size:13px}.in{color:var(--in)}.out{color:var(--out)}
.big{font-size:26px;font-weight:800}
input,select{width:100%;padding:13px 14px;margin:6px 0;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:13px 16px;border:0;border-radius:13px;background:var(--main);color:#fff;font:inherit;font-weight:700;cursor:pointer;letter-spacing:.1px}
button.ghost{background:none;color:var(--out);padding:4px 8px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--main)}
.cols{display:flex;gap:6px;align-items:flex-end;height:120px}
.cols div{flex:1;text-align:center;font-size:11px}
.cols span{display:inline-block;width:40%;margin:0 1px;border-radius:3px 3px 0 0;vertical-align:bottom}
.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-ink);padding:22px 16px 60px;border-radius:0 0 28px 28px;margin-bottom:-46px;border:var(--hero-border)}
.hero .greet{font-size:20px;font-weight:800}
.hero .mute{color:var(--hero-mute)}
.hero .pill{display:inline-block;background:var(--hero-chip);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-top:10px}
.monthNav{background:var(--hero-chip);color:var(--hero-ink);width:34px;height:34px;border-radius:50%;padding:0;font-size:18px;margin-top:10px;line-height:1}
.monthNav:disabled{opacity:.35}
.hero .bal{font-size:34px;font-weight:800;margin:6px 0 12px}
.chips{display:flex;gap:8px}
.chip{flex:1;background:var(--hero-chip);border-radius:14px;padding:12px}
.chip .n{font-weight:700;font-size:15px}
.qa{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.qa::-webkit-scrollbar{display:none}
.qaItem{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink);background:none;border:0;flex:0 0 auto;width:68px;font-weight:600;font-family:var(--font)}
.qaIcon{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px}
.gear{position:fixed;top:14px;right:14px;z-index:30;width:38px;height:38px;border-radius:50%;background:var(--hero-chip);color:var(--hero-ink);display:flex;align-items:center;justify-content:center;font-size:18px;border:0;padding:0;cursor:pointer}
.wrap .gear{position:absolute;top:16px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end}
.scanBtn{width:100%;background:var(--bg);color:var(--ink);border:1px dashed var(--line);text-align:center}
.scanRaw{max-height:120px;overflow:auto;background:var(--bg);border-radius:10px;padding:8px;font-size:11px;white-space:pre-wrap;color:var(--mute)}
.sheet{background:var(--card);color:var(--ink);width:100%;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.segTabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px}
.segTabs button{flex:1;background:none;color:var(--mute);font-weight:600;padding:9px 0;border-radius:9px;box-shadow:none}
.segTabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sheet h3{margin:0 0 12px;font-size:17px}
.theme-opt{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.theme-opt:last-child{border-bottom:0}
.swatch{width:34px;height:34px;border-radius:10px;flex-shrink:0}
.theme-opt b{display:block}
.theme-opt.on{font-weight:700}
.theme-opt .check{margin-left:auto;color:var(--main);font-weight:800}
.icon{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.txitem{display:flex;gap:10px;align-items:center}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:flex-end;background:var(--card);border-top:0;box-shadow:0 -1px 6px rgba(0,0,0,.06);padding:6px 0}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:10px 0 8px;font-size:11px;font-weight:600}
nav button.on{color:var(--main)}
nav button.fab{position:relative;top:-18px;flex:0 0 auto;width:54px;height:54px;border-radius:50%;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;font-size:26px;font-weight:400;box-shadow:0 6px 14px rgba(57,86,245,.4);display:flex;align-items:center;justify-content:center;margin:0 10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ====== ISI DENGAN DATA SUPABASE KAMU (Project Settings > API) ======
const SUPABASE_URL = 'https://pdwehqekftzjcbtgupdn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkd2VocWVrZnR6amNidGd1cGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzA2MzQsImV4cCI6MjEwNTc0NjYzNH0.nQKP0xtpKa3WKMomfzLnJCNi-QnhWW1UeMamFFYfjQs';
// ====================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const v = id => $(id).value;
const CURS = ['IDR', 'USD', 'EUR', 'SGD', 'MYR', 'JPY', 'AUD', 'GBP', 'SAR', 'TWD'];
let CUR = 'IDR', RATES = { IDR: 1 }, RATE_T = null;
try { CUR = localStorage.getItem('cur') || 'IDR'; const c = JSON.parse(localStorage.getItem('rates') || 'null'); if (c) { RATES = c.rates; RATE_T = c.t; } } catch (e) {}
const rp = n => {
  const cur = RATES[CUR] ? CUR : 'IDR', d = ['IDR', 'JPY'].includes(cur) ? 0 : 2;
  return new Intl.NumberFormat(cur === 'IDR' ? 'id-ID' : 'en-US', { style: 'currency', currency: cur, minimumFractionDigits: d, maximumFractionDigits: d }).format(n * RATES[cur]);
};
async function fetchRates() { // kurs terbaru, dipanggil setiap halaman dibuka
  try {
    const j = await (await fetch('https://open.er-api.com/v6/latest/IDR')).json();
    if (j.result !== 'success') throw 0;
    RATES = j.rates; RATE_T = Date.now();
    try { localStorage.setItem('rates', JSON.stringify({ rates: RATES, t: RATE_T })); } catch (e) {}
  } catch (e) { /* pakai kurs tersimpan */ }
  if (document.querySelector('nav')) render();
}
function parseAmt(raw) { // terima "50.000", "50,000", "50000", "12.5" dsb
  let s = String(raw || '').trim().replace(/\s/g, '').replace(/,/g, '.');
  if (!s) return 0;
  const parts = s.split('.');
  if (parts.length > 2) { s = parts.slice(0, -1).join('') + '.' + parts[parts.length - 1]; }
  if (['IDR', 'JPY'].includes(CUR)) s = s.replace(/\./g, ''); // IDR/JPY tidak punya desimal, titik = pemisah ribuan
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function inIDR(id) { // baca input dalam mata uang terpilih, kembalikan Rupiah (null = kurs belum ada)
  const x = parseAmt(v(id));
  if (!x) return 0;
  if (CUR === 'IDR') return x;
  const r = RATES[CUR];
  if (!r) { alert('Kurs ' + CUR + ' belum tersedia. Pilih IDR dulu atau coba lagi nanti.'); return null; }
  return Math.round(x / r);
}
function setCur(c) { CUR = c; try { localStorage.setItem('cur', c); } catch (e) {} render(); }
function toCurVal(idr) {
  if (CUR === 'IDR' || !RATES[CUR]) return Math.round(idr);
  const x = idr * RATES[CUR];
  return ['IDR', 'JPY'].includes(CUR) ? Math.round(x) : +x.toFixed(2);
}
function curBar() {
  const r = RATES[CUR], t = RATE_T ? new Date(RATE_T).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const info = CUR === 'IDR' ? 'Semua jumlah dalam Rupiah' : r ? `1 ${CUR} = Rp${(1 / r).toLocaleString('id-ID', { maximumFractionDigits: 2 })} · kurs ${t} · input dalam ${CUR}` : 'Kurs belum tersedia, tampil dalam Rupiah';
  return `<div class="row mute" style="margin-bottom:4px"><span>${info}</span><select id="cur" style="width:auto" onchange="setCur(this.value)">${CURS.map(c => `<option ${c === CUR ? 'selected' : ''}>${c}</option>`).join('')}</select></div>`;
}
const today = () => new Date().toLocaleDateString('en-CA');
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const sum = (a, t) => a.filter(x => x.type === t).reduce((s, x) => s + +x.amount, 0);
function shiftMonth(m, n) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return ym(d); }
let S = { acc: [], tx: [], inst: [], sav: [], mv: [], bud: [], rec: [], tab: 'home', month: ym(new Date()) };
const THEMES = {
  modern: { label: 'Modern (Biru)', swatch: '#3956f5', vars: { '--bg': '#eef1f8', '--card': '#fff', '--ink': '#151a30', '--mute': '#7c85a3', '--line': '#e4e8f5', '--main': '#3956f5', '--main2': '#2540d6', '--in': '#1fa15c', '--out': '#e5533d', '--hero1': '#3956f5', '--hero2': '#2135b8', '--hero-ink': '#fff', '--hero-mute': 'rgba(255,255,255,.75)', '--hero-chip': 'rgba(255,255,255,.14)', '--hero-border': 'none', '--font': "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" } },
  klasik: { label: 'Klasik (Hijau)', swatch: '#1f6b4a', vars: { '--bg': '#f3f6f2', '--card': '#fff', '--ink': '#16241c', '--mute': '#66756b', '--line': '#dbe4dc', '--main': '#1f6b4a', '--main2': '#18563b', '--in': '#1f6b4a', '--out': '#c2452d', '--hero1': '#fff', '--hero2': '#fff', '--hero-ink': '#16241c', '--hero-mute': '#66756b', '--hero-chip': '#f3f6f2', '--hero-border': '1px solid #dbe4dc', '--font': "Georgia,'Times New Roman',serif" } },
  gelap: { label: 'Gelap Elegan (Ungu)', swatch: '#7c5cff', vars: { '--bg': '#120f1e', '--card': '#1c1830', '--ink': '#efeaff', '--mute': '#9b93c2', '--line': '#2e2850', '--main': '#8b6bff', '--main2': '#6f4dff', '--in': '#33c281', '--out': '#ff6b6b', '--hero1': '#5c3ff0', '--hero2': '#2a1866', '--hero-ink': '#fff', '--hero-mute': 'rgba(255,255,255,.75)', '--hero-chip': 'rgba(255,255,255,.14)', '--hero-border': 'none', '--font': "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" } },
  minimal: { label: 'Minimalis (Monokrom)', swatch: '#111827', vars: { '--bg': '#f5f5f4', '--card': '#fff', '--ink': '#111827', '--mute': '#6b7280', '--line': '#e5e7eb', '--main': '#111827', '--main2': '#000', '--in': '#0f8a4b', '--out': '#c1382b', '--hero1': '#fff', '--hero2': '#fff', '--hero-ink': '#111827', '--hero-mute': '#6b7280', '--hero-chip': '#f5f5f4', '--hero-border': '1px solid #e5e7eb', '--font': "'Helvetica Neue',Arial,sans-serif" } },
};
let CURRENT_THEME = 'modern';
function applyTheme(name) {
  const t = THEMES[name]; if (!t) return;
  CURRENT_THEME = name;
  Object.entries(t.vars).forEach(([k, val]) => document.documentElement.style.setProperty(k, val));
  try { localStorage.setItem('theme', name); } catch (e) {}
}
try { applyTheme(localStorage.getItem('theme') || 'modern'); } catch (e) { applyTheme('modern'); }
let showThemeSheet = false, CURRENT_USER = null;
let showAddSheet = false, addMode = null, editing = null;
function toggleAddSheet(v) { showAddSheet = v; if (!v) { addMode = null; editing = null; } render(); }
function goAdd(mode) { editing = null; addMode = mode; render(); }
function editRow(table, id) {
  editing = { table, id };
  addMode = { transactions: 'trx', installments: 'inst', savings: 'sav', accounts: 'accs' }[table];
  showAddSheet = true; render();
}
function addSheetHtml() {
  if (!showAddSheet) return '';
  if (!addMode) {
    const opts = [['trx', '💸', 'Transaksi', 'Catat pemasukan / pengeluaran'], ['transfer', '🔁', 'Transfer', 'Pindah saldo antar rekening'], ['inst', '🏦', 'Cicilan', 'Tambah cicilan baru'], ['sav', '💰', 'Tabungan', 'Buat atau isi tabungan'], ['accs', '🏛️', 'Rekening', 'Tambah rekening baru'], ['budget', '🎯', 'Budget', 'Atur batas pengeluaran kategori'], ['recurring', '📆', 'Transaksi berulang', 'Otomatis tiap bulan (gaji, langganan...)']];
    return `<div class="sheet-bg" onclick="if(event.target===this)toggleAddSheet(false)"><div class="sheet"><h3>Mau tambah apa?</h3>
      ${opts.map(([k, ic, l, d]) => `<div class="theme-opt" onclick="goAdd('${k}')"><div class="icon" style="background:var(--bg)">${ic}</div><div><b>${l}</b><div class="mute">${d}</div></div></div>`).join('')}
      <button style="width:100%;margin-top:12px;background:var(--bg);color:var(--ink)" onclick="toggleAddSheet(false)">Batal</button>
    </div></div>`;
  }
  const titles = { trx: editing ? 'Edit transaksi' : 'Tambah transaksi', transfer: 'Transfer antar rekening', inst: editing ? 'Edit cicilan' : 'Tambah cicilan', sav: editing ? 'Edit tabungan' : 'Buat tabungan', accs: editing ? 'Edit rekening' : 'Tambah rekening', budget: editing ? 'Edit budget' : 'Atur budget', recurring: editing ? 'Edit transaksi berulang' : 'Buat transaksi berulang' };
  const needsAcc = (addMode === 'trx' || addMode === 'inst' || addMode === 'recurring') && !S.acc.length;
  const needs2Acc = addMode === 'transfer' && S.acc.length < 2;
  let body;
  const accSel = (id, selId) => `<select id="${id}">${S.acc.map(a => `<option value="${a.id}" ${selId === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>`;
  if (needsAcc) {
    body = `<div class="mute" style="margin-bottom:10px">Belum ada rekening. Tambah rekening dulu ya.</div>
      <input id="qa_name" placeholder="Nama rekening (BCA, Dompet, GoPay...)">
      <input id="qa_bal" type="text" inputmode="decimal" placeholder="Saldo awal (${CUR})">
      <button style="width:100%" onclick="addAcc('qa_')">Tambah rekening</button>`;
  } else if (addMode === 'trx') {
    const ed = editing && editing.table === 'transactions' ? S.tx.find(x => x.id === editing.id) : null;
    body = `${ed ? '' : `<button class="scanBtn" onclick="document.getElementById('scanFile').click()">📷 Scan Struk</button>
      <input id="scanFile" type="file" accept="image/*" style="display:none" onchange="scanReceipt(this.files[0],'qt_')">
      <div id="scanStatus"></div>`}
      <select id="qt_type"><option value="expense" ${!ed || ed.type === 'expense' ? 'selected' : ''}>Pengeluaran</option><option value="income" ${ed && ed.type === 'income' ? 'selected' : ''}>Pemasukan</option></select>
      ${accSel('qt_acc', ed ? ed.account_id : null)}
      <input id="qt_amt" type="text" inputmode="decimal" placeholder="Jumlah (${CUR}), contoh 50.000" value="${ed ? toCurVal(ed.amount) : ''}">
      <input id="qt_cat" placeholder="Kategori (makan, gaji, transport...)" value="${ed ? esc(ed.category || '') : ''}">
      <input id="qt_note" placeholder="Catatan (opsional)" value="${ed ? esc(ed.note || '') : ''}">
      <input id="qt_date" type="date" value="${ed ? ed.date : today()}">
      <button style="width:100%" onclick="addTx('qt_')">${ed ? 'Simpan perubahan' : 'Simpan transaksi'}</button>
      ${ed ? `<button class="ghost" style="width:100%;margin-top:8px" onclick="del('transactions','${ed.id}');toggleAddSheet(false)">Hapus transaksi</button>` : ''}`;
  } else if (addMode === 'transfer') {
    if (needs2Acc) {
      body = `<div class="mute">Butuh minimal 2 rekening untuk transfer.</div><button style="width:100%;margin-top:10px" onclick="goAdd('accs')">Tambah rekening</button>`;
    } else {
      body = `<div class="mute" style="margin-bottom:4px">Dari rekening</div>${accSel('qf_from')}
      <div class="mute" style="margin:8px 0 4px">Ke rekening</div>${accSel('qf_to')}
      <input id="qf_amt" type="text" inputmode="decimal" placeholder="Jumlah (${CUR})">
      <input id="qf_note" placeholder="Catatan (opsional)">
      <input id="qf_date" type="date" value="${today()}">
      <button style="width:100%" onclick="addTransfer()">Transfer</button>`;
    }
  } else if (addMode === 'inst') {
    const ed = editing && editing.table === 'installments' ? S.inst.find(x => x.id === editing.id) : null;
    body = `<input id="qi_name" placeholder="Nama cicilan (HP, motor...)" value="${ed ? esc(ed.name) : ''}">
      <input id="qi_amt" type="text" inputmode="decimal" placeholder="Cicilan per bulan (${CUR})" value="${ed ? toCurVal(ed.monthly_amount) : ''}">
      <input id="qi_tot" type="text" inputmode="decimal" placeholder="Total bulan" value="${ed ? ed.total_months : ''}">
      <input id="qi_paid" type="text" inputmode="decimal" placeholder="Sudah dibayar berapa bulan (opsional)" value="${ed ? ed.paid_months : ''}">
      ${accSel('qi_acc', ed ? ed.account_id : null)}
      <button style="width:100%" onclick="addInst('qi_')">${ed ? 'Simpan perubahan' : 'Tambah cicilan'}</button>
      ${ed ? `<button class="ghost" style="width:100%;margin-top:8px" onclick="del('installments','${ed.id}');toggleAddSheet(false)">Hapus cicilan</button>` : ''}`;
  } else if (addMode === 'sav') {
    const ed = editing && editing.table === 'savings' ? S.sav.find(x => x.id === editing.id) : null;
    body = `<input id="qs_name" placeholder="Nama tabungan (dana darurat, liburan...)" value="${ed ? esc(ed.name) : ''}">
      <input id="qs_tgt" type="text" inputmode="decimal" placeholder="Target (${CUR}, opsional)" value="${ed && ed.target ? toCurVal(ed.target) : ''}">
      <button style="width:100%" onclick="addSav('qs_')">${ed ? 'Simpan perubahan' : 'Buat tabungan'}</button>
      ${ed ? `<button class="ghost" style="width:100%;margin-top:8px" onclick="del('savings','${ed.id}');toggleAddSheet(false)">Hapus tabungan</button>` : '<div class="mute" style="margin-top:8px">Untuk isi/tarik dana tabungan yang sudah ada, buka tab Tabungan ya.</div>'}`;
  } else if (addMode === 'budget') {
    const ed = editing && editing.table === 'budgets' ? S.bud.find(x => x.id === editing.id) : null;
    body = `<input id="qb_cat" placeholder="Kategori (makan, transport...)" value="${ed ? esc(ed.category) : ''}">
      <input id="qb_limit" type="text" inputmode="decimal" placeholder="Batas per bulan (${CUR})" value="${ed ? toCurVal(ed.monthly_limit) : ''}">
      <button style="width:100%" onclick="addBudget('qb_')">${ed ? 'Simpan perubahan' : 'Simpan budget'}</button>
      ${ed ? `<button class="ghost" style="width:100%;margin-top:8px" onclick="del('budgets','${ed.id}');toggleAddSheet(false)">Hapus budget</button>` : '<div class="mute" style="margin-top:8px">Progresnya muncul di Beranda, di bagian Budget.</div>'}`;
  } else if (addMode === 'recurring') {
    if (needsAcc) {
      body = `<div class="mute">Belum ada rekening. Tambah rekening dulu ya.</div><button style="width:100%;margin-top:10px" onclick="goAdd('accs')">Tambah rekening</button>`;
    } else {

async function run(p) { const { error } = await p; if (error) { alert(error.message); return false; } return true; }

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { CURRENT_USER = session.user; load(); } else authView();
}
async function load(skipRecurring) {
  const [a, t, i, sv, mv, bu, rc] = await Promise.all([
    sb.from('accounts').select('*').order('created_at'),
    sb.from('transactions').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('installments').select('*').order('created_at'),
    sb.from('savings').select('*').order('created_at'),
    sb.from('saving_moves').select('*').order('created_at'),
    sb.from('budgets').select('*').order('created_at'),
    sb.from('recurring').select('*').order('created_at')
  ]);
  S.acc = a.data || []; S.tx = t.data || []; S.inst = i.data || []; S.sav = sv.data || []; S.mv = mv.data || [];
  S.bud = bu.data || []; S.rec = rc.data || [];
  if (!skipRecurring && await runRecurring()) return load(true); // transaksi otomatis dibuat -> muat ulang sekali
  render();
}
async function runRecurring() {
  if (!S.rec.length) return false;
  const nowYm = ym(new Date()), today = new Date().getDate();
  let did = false;
  for (const r of S.rec) {
    if (r.last_run === nowYm || today < r.day_of_month) continue;
    const date = nowYm + '-' + String(r.day_of_month).padStart(2, '0');
    await sb.from('transactions').insert({ account_id: r.account_id, type: r.type, amount: r.amount, category: r.category, note: (r.note ? r.note + ' · ' : '') + 'Otomatis: ' + r.name, date });
    await sb.from('recurring').update({ last_run: nowYm }).eq('id', r.id);
    did = true;
  }
  return did;
}

// ---------- Auth ----------
let showForgot = false, showRecovery = false;
function toggleForgot(v) { showForgot = v; render(); }
function authView() {
  if (showRecovery) { $('app').innerHTML = recoveryHtml(); return; }
  $('app').innerHTML = gearBtn() + themeSheetHtml() + `<div class="wrap"><h1>Duitku <span class="mute">v30</span></h1><div class="card">
    ${showForgot ? `
      <div class="mute" style="margin-bottom:10px">Masukkan email kamu, nanti kami kirim link untuk atur ulang password.</div>
      <input id="fp_email" type="email" placeholder="Email" autocomplete="email">
      <button style="width:100%" onclick="sendReset()">Kirim link reset</button>
      <button class="ghost" style="width:100%;margin-top:8px" onclick="toggleForgot(false)">‹ Kembali ke login</button>
    ` : `
      <input id="em" type="email" placeholder="Email" autocomplete="email">
      <input id="pw" type="password" placeholder="Kata sandi (min. 6 karakter)" autocomplete="current-password">
      <div class="row"><button onclick="login()">Masuk</button><button class="ghost" style="color:var(--main)" onclick="signup()">Daftar akun baru</button></div>
      <button class="ghost" style="width:100%;margin-top:8px" onclick="toggleForgot(true)">Lupa password?</button>
    `}
  </div></div>`;
}
function recoveryHtml() {
  return `<div class="wrap"><h1>Atur password baru</h1><div class="card">
    <div class="mute" style="margin-bottom:10px">Link reset terverifikasi. Masukkan password baru kamu.</div>
    <input id="rc_pw1" type="password" placeholder="Password baru (min. 6 karakter)" autocomplete="new-password">
    <input id="rc_pw2" type="password" placeholder="Ulangi password baru" autocomplete="new-password">
    <button style="width:100%" onclick="finishRecovery()">Simpan password baru</button>
  </div></div>`;
}
async function sendReset() {
  const email = v('fp_email').trim();
  if (!email) return alert('Isi email kamu.');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if (error) return alert(error.message);
  alert('Link reset sudah dikirim. Cek inbox (atau folder spam) di email kamu.');
  showForgot = false; render();
}
async function finishRecovery() {
  const p1 = v('rc_pw1'), p2 = v('rc_pw2');
  if (p1.length < 6) return alert('Password minimal 6 karakter.');
  if (p1 !== p2) return alert('Konfirmasi password tidak cocok.');
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) return alert(error.message);
  showRecovery = false; alert('Password berhasil diganti. Kamu sudah masuk.'); load();
}
function needCred() { if (!v('em').trim() || v('pw').length < 6) { alert('Isi email dan kata sandi (min. 6 karakter).'); return true; } }
async function login() {
  if (needCred()) return;
  const email = v('em').trim();
  const { data, error } = await sb.auth.signInWithPassword({ email, password: v('pw') });
  if (error) return alert(error.message + ' [debug: email ' + email.length + ' karakter]');
  CURRENT_USER = data.user; load();
}
async function signup() {
  if (needCred()) return;
  const { data, error } = await sb.auth.signUp({ email: v('em').trim(), password: v('pw') });
  if (error) return alert(error.message + ' [debug: email ' + v('em').trim().length + ' karakter]');
  if (data.session) { CURRENT_USER = data.user; load(); } else alert('Cek email kamu untuk konfirmasi, lalu masuk.');
}
async function logout() { await sb.auth.signOut(); CURRENT_USER = null; showThemeSheet = false; authView(); }

const accBal = a => +a.balance + sum(S.tx.filter(t => t.account_id === a.id), 'income') - sum(S.tx.filter(t => t.account_id === a.id), 'expense')
  - sum(S.mv.filter(m => m.account_id === a.id), 'deposit') + sum(S.mv.filter(m => m.account_id === a.id), 'withdraw');
const savBal = x => sum(S.mv.filter(m => m.saving_id === x.id), 'deposit') - sum(S.mv.filter(m => m.saving_id === x.id), 'withdraw');

const CAT_ICON = { makan: '🍜', makanan: '🍜', minuman: '🥤', transport: '🚗', bensin: '⛽', belanja: '🛍️', gaji: '💰', tagihan: '🧾', listrik: '💡', pulsa: '📱', kesehatan: '💊', cicilan: '🏦', hiburan: '🎬', pendidikan: '📚', hadiah: '🎁', lainnya: '💳' };
const catIcon = k => CAT_ICON[(k || '').toLowerCase()] || (k ? '💳' : '💳');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let txFilter = { q: '', cat: '', from: '', to: '' };
function setTxFilter(k, val) { txFilter[k] = val; render(); }
function clearTxFilter() { txFilter = { q: '', cat: '', from: '', to: '' }; render(); }
function trx() {
  if (!S.acc.length) return `<h1>Transaksi</h1><div class="card">Tambah rekening dulu lewat tombol + di bawah.</div>`;
  const cats = [...new Set(S.tx.map(t => t.category || 'Lainnya'))].sort();
  let list = S.tx;
  const f = txFilter;
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(t => (t.category || '').toLowerCase().includes(q) || (t.note || '').toLowerCase().includes(q) || accName(t.account_id).toLowerCase().includes(q)); }
  if (f.cat) list = list.filter(t => (t.category || 'Lainnya') === f.cat);
  if (f.from) list = list.filter(t => t.date >= f.from);
  if (f.to) list = list.filter(t => t.date <= f.to);
  const active = f.q || f.cat || f.from || f.to;
  return `<h1>Transaksi</h1>
  <div class="card">
    <input id="txq" placeholder="Cari kategori, catatan, atau rekening..." value="${esc(f.q)}" onchange="setTxFilter('q', this.value)">
    <select onchange="setTxFilter('cat', this.value)"><option value="">Semua kategori</option>${cats.map(c => `<option value="${esc(c)}" ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <div class="row"><input type="date" value="${f.from}" onchange="setTxFilter('from', this.value)"><input type="date" value="${f.to}" onchange="setTxFilter('to', this.value)"></div>
    ${active ? `<button class="ghost" style="width:100%" onclick="clearTxFilter()">Bersihkan filter (${list.length} hasil)</button>` : ''}
  </div>
  ${list.slice(0, active ? 300 : 50).map(t => `<div class="card row"><div class="txitem" style="cursor:pointer" onclick="editRow('transactions','${t.id}')"><div class="icon">${catIcon(t.category)}</div><div><b>${esc(t.category || 'Lainnya')}</b> <span class="mute">${esc(t.note || '')}</span>
    <div class="mute">${t.date} · ${esc(accName(t.account_id))}</div></div></div>
    <div style="text-align:right"><b class="${t.type === 'income' ? 'in' : 'out'}">${t.type === 'income' ? '+' : '-'}${rp(t.amount)}</b><br>
    <button class="ghost" onclick="del('transactions','${t.id}')">Hapus</button></div></div>`).join('') || '<p class="mute">Tidak ada transaksi yang cocok.</p>'}
  ${S.rec.length ? `<h2 style="margin-left:0">Transaksi berulang</h2>${S.rec.map(r => `<div class="card row" style="cursor:pointer" onclick="editRow('recurring','${r.id}')"><div><b>${esc(r.name)}</b> <span class="mute">tgl ${r.day_of_month}</span>
    <div class="mute">${esc(accName(r.account_id))}${r.category ? ' · ' + esc(r.category) : ''}</div></div>
    <b class="${r.type === 'income' ? 'in' : 'out'}">${r.type === 'income' ? '+' : '-'}${rp(r.amount)}</b></div>`).join('')}` : ''}`;
}

// ---------- Import CSV ----------
function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
  const splitLine = line => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else { if (c === '"') q = true; else if (c === ',' || c === ';') { out.push(cur); cur = ''; } else cur += c; }
    }
    out.push(cur); return out.map(s => s.trim());
  };
  const header = splitLine(lines[0]).map(h => h.toLowerCase());
  const rows = [];
  for (let i = 1; i < lines.length; i++) { const cells = splitLine(lines[i]); const obj = {}; header.forEach((h, idx) => obj[h] = cells[idx] ?? ''); rows.push(obj); }
  return rows;
}
async function importCsv(file) {
  if (!file) return;
  const box = $('impStatus');
  box.innerHTML = '<div class="mute" style="margin-top:6px">⏳ Membaca file...</div>';
  try {
    const text = await file.text();
    const rows = parseCSV(text);
    const col = (o, names) => { for (const n of names) if (o[n] !== undefined && o[n] !== '') return o[n]; return ''; };
    const accCache = {}; S.acc.forEach(a => accCache[a.name.toLowerCase()] = a.id);
    const toInsert = []; let skipped = 0;
    for (const r of rows) {
      let dateRaw = col(r, ['tanggal', 'date']), date = dateRaw;
      const dm = dateRaw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (dm) { let [, d, mo, y] = dm; if (y.length === 2) y = '20' + y; date = y + '-' + mo.padStart(2, '0') + '-' + d.padStart(2, '0'); }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped++; continue; }
      const accNameRaw = col(r, ['rekening', 'account']) || S.acc[0]?.name || '';
      let accId = accCache[accNameRaw.toLowerCase()];
      if (!accId && accNameRaw) {
        const { data, error } = await sb.from('accounts').insert({ name: accNameRaw, balance: 0 }).select().single();
        if (!error && data) { accId = data.id; accCache[accNameRaw.toLowerCase()] = accId; S.acc.push(data); }
      }
      if (!accId) { skipped++; continue; }
      let type = col(r, ['tipe', 'type']).toLowerCase();
      const incAmt = parseAmt(col(r, ['pemasukan', 'income'])), expAmt = parseAmt(col(r, ['pengeluaran', 'expense']));
      let amount = 0;
      if (incAmt > 0) { amount = incAmt; type = 'income'; }
      else if (expAmt > 0) { amount = expAmt; type = 'expense'; }
      else { amount = parseAmt(col(r, ['jumlah', 'amount'])); type = /masuk|income|in\b/i.test(type) ? 'income' : 'expense'; }
      if (!(amount > 0)) { skipped++; continue; }
      toInsert.push({ account_id: accId, type, amount, category: col(r, ['kategori', 'category']) || null, note: col(r, ['catatan', 'note']) || null, date });
    }
    if (toInsert.length) await run(sb.from('transactions').insert(toInsert));
    box.innerHTML = `<div class="mute" style="margin-top:6px">✅ ${toInsert.length} transaksi diimpor${skipped ? ', ' + skipped + ' baris dilewati' : ''}.</div>`;
    load();
  } catch (e) {
    box.innerHTML = '<div class="mute" style="margin-top:6px">⚠️ Gagal membaca file (' + esc(e.message || e) + ').</div>';
  }
}

// ---------- Scan struk (OCR di browser) ----------
async function scanReceipt(file, p) {
  p = p || 't_';
  if (!file) return;
  if (typeof Tesseract === 'undefined') return alert('Library scan belum termuat. Cek koneksi lalu coba lagi.');
  const box = $('scanStatus');
  box.innerHTML = '<div class="mute" style="margin:6px 0">⏳ Membaca struk... (bisa 10-30 detik)</div>';
  try {
    const { data } = await Tesseract.recognize(file, 'ind+eng');
    const text = data.text || '';
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

    // Cari nominal total: baris mengandung kata kunci total/bayar, ambil angka terbesar di baris itu
    const numRe = /(\d[\d.,]{2,})/g;
    const toNum = raw => parseAmt(raw.replace(/[^\d.,]/g, ''));
    let best = 0;
    const kwRe = /(grand\s*total|total\s*bayar|total|jumlah|bayar|tunai|cash)/i;
    lines.forEach(l => { if (kwRe.test(l)) { const m = l.match(numRe); if (m) { const n = Math.max(...m.map(toNum)); if (n > best) best = n; } } });
    if (!best) { const all = (text.match(numRe) || []).map(toNum).filter(n => n > 100); if (all.length) best = Math.max(...all); }

    // Tanggal: dd/mm/yyyy, dd-mm-yyyy, atau yyyy-mm-dd
    let dateVal = '';
    const dm = text.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (dm) { let [, d, mo, y] = dm; if (y.length === 2) y = '20' + y; if (+d <= 31 && +mo <= 12) dateVal = y + '-' + mo.padStart(2, '0') + '-' + d.padStart(2, '0'); }

    const merchant = lines.find(l => l.length > 2 && !/^\d/.test(l)) || '';

    if (best) $(p + 'amt').value = String(Math.round(best));
    if (merchant) $(p + 'note').value = merchant.slice(0, 60);
    if (dateVal) $(p + 'date').value = dateVal;
    box.innerHTML = (best ? '<div class="mute" style="margin:6px 0">✅ Terdeteksi: ' + rp(best) + '. Cek dulu sebelum simpan.</div>' : '<div class="mute" style="margin:6px 0">⚠️ Jumlah tidak terbaca otomatis, isi manual ya.</div>') +
      '<details style="margin-bottom:8px"><summary class="mute" style="cursor:pointer">Lihat teks hasil scan</summary><div class="scanRaw">' + esc(text || '(kosong)') + '</div></details>';
  } catch (e) {
    box.innerHTML = '<div class="mute" style="margin:6px 0">⚠️ Gagal membaca struk (' + esc(e.message || e) + '). Isi manual ya.</div>';
  }
}

  if (p1 !== p2) return alert('Konfirmasi password tidak cocok.');
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) return alert(error.message);
  $('pf_pw1').value = ''; $('pf_pw2').value = ''; alert('Password berhasil diubah.');
}
async function pay(id) {
  const i = S.inst.find(x => x.id === id);
  if (!i || i.paid_months >= i.total_months) return;
  if (!confirm(`Bayar ${i.name} ${rp(i.monthly_amount)} dari ${accName(i.account_id)}?`)) return;
  const ok = await run(sb.from('transactions').insert({ account_id: i.account_id, installment_id: i.id, type: 'expense', amount: i.monthly_amount, category: 'Cicilan', note: i.name, date: today() }));
  if (ok && await run(sb.from('installments').update({ paid_months: i.paid_months + 1 }).eq('id', id))) load();
}
async function del(table, id) {
  if (!confirm('Hapus data ini?' + (table === 'accounts' ? ' Semua transaksi & cicilan di rekening ini ikut terhapus.' : table === 'savings' ? ' Riwayat tabungan ikut terhapus, dan dana yang pernah ditarik ke rekening ikut dibatalkan dari saldo rekening.' : ''))) return;
  if (await run(sb.from(table).delete().eq('id', id))) load();
}
fetchRates();
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { CURRENT_USER = session.user; showRecovery = true; authView(); }
});
boot();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }
</script>
