<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script>
  // Cek apakah splash screen sudah pernah tampil di sesi browser ini
  try {
    if (sessionStorage.getItem('duitku_splash_shown')) {
      document.documentElement.classList.add('no-splash');
    }
  } catch(e) {}
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duitku — Smart Personal Finance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duitku">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-subtle: #f1f5f9;
  --card-hover: #e2e8f0;
  --ink: #0f172a;
  --ink-secondary: #334155;
  --mute: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --main: #2563eb;
  --main2: #1d4ed8;
  --main-light: #eff6ff;
  --in: #059669;
  --in-bg: #ecfdf5;
  --out: #e11d48;
  --out-bg: #fff1f2;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --hero1: #1e3a8a;
  --hero2: #0f172a;
  --hero-ink: #ffffff;
  --hero-mute: #94a3b8;
  --hero-chip: rgba(255, 255, 255, 0.12);
  --hero-chip-hover: rgba(255, 255, 255, 0.2);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 8px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 20px -3px rgba(15, 23, 42, 0.09);
  --shadow-float: 0 12px 24px -4px rgba(37, 99, 235, 0.38);
  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #090d16;
    --card: #131b2e;
    --card-subtle: #1a243d;
    --card-hover: #22304e;
    --ink: #f8fafc;
    --ink-secondary: #cbd5e1;
    --mute: #8192a9;
    --line: #1e293b;
    --line-strong: #334155;
    --main: #3b82f6;
    --main2: #60a5fa;
    --main-light: rgba(59, 130, 246, 0.15);
    --in: #10b981;
    --in-bg: rgba(16, 185, 129, 0.14);
    --out: #f43f5e;
    --out-bg: rgba(244, 63, 94, 0.14);
    --warn: #fbbf24;
    --warn-bg: rgba(251, 191, 36, 0.14);
    --hero1: #172554;
    --hero2: #090d16;
    --hero-chip: rgba(255, 255, 255, 0.08);
    --hero-chip-hover: rgba(255, 255, 255, 0.15);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.5);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.55 var(--font);
  font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  padding-bottom: 96px;
  min-height: 100vh;
  transition: background 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

main { max-width: 620px; margin: 0 auto; position: relative; }
.wrap { padding: 0 16px; }

/* Typo */
h1 { font-size: 22px; font-weight: 800; margin: 0 0 16px; padding: 20px 0 0; letter-spacing: -0.025em; }
h2 { font-size: 15px; font-weight: 700; margin: 24px 0 12px; letter-spacing: -0.015em; color: var(--ink-secondary); display: flex; align-items: center; justify-content: space-between; }
.num, .big, .bal, .n, [data-num] { font-variant-numeric: tabular-nums; }

/* Cards & Surfaces */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 12px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  position: relative;
}
.card:hover { border-color: var(--line-strong); }

.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mute { color: var(--mute); font-size: 12.5px; }
.in { color: var(--in); }
.out { color: var(--out); }
.warn { color: var(--warn); }
.big { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }

/* Controls */
input, select, textarea {
  width: 100%;
  padding: 13px 15px;
  margin: 6px 0;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--main);
  box-shadow: 0 0 0 3px var(--main-light);
  background: var(--card);
}
input::placeholder { color: var(--mute); opacity: 0.7; }

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--main);
  color: #fff;
  font: inherit;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
button:hover { opacity: 0.94; transform: translateY(-1px); }
button:active { transform: translateY(1px); opacity: 0.85; }
button.ghost {
  background: transparent;
  color: var(--mute);
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
}
button.ghost:hover { background: var(--card-subtle); color: var(--ink); transform: none; }
button.ghost.danger { color: var(--out); }
button.ghost.danger:hover { background: var(--out-bg); }
button.outline {
  background: transparent;
  border: 1.5px solid var(--line-strong);
  color: var(--ink);
}
button.outline:hover { background: var(--card-subtle); border-color: var(--main); color: var(--main); }

/* Progress Bar */
.bar {
  height: 8px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--main);
  border-radius: 99px;
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Category Quick Chips */
.chips-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0 8px;
  -webkit-overflow-scrolling: touch;
}
.chips-scroll::-webkit-scrollbar { display: none; }
.cat-chip {
  flex: 0 0 auto;
  background: var(--card-subtle);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.cat-chip:hover, .cat-chip.active {
  background: var(--main-light);
  border-color: var(--main);
  color: var(--main);
}

/* Hero Section */
.hero {
  background: linear-gradient(145deg, var(--hero1) 0%, var(--hero2) 100%);
  color: var(--hero-ink);
  padding: 24px 20px 48px;
  border-radius: 0 0 var(--radius-xl) var(--radius-xl);
  margin-bottom: -32px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.hero .greet {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--hero-mute);
}
.hero .gear {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--hero-chip);
  color: var(--hero-ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}
.hero .gear:hover { background: var(--hero-chip-hover); transform: rotate(30deg); }
.hero .bal-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--hero-mute);
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hero .bal {
  font-size: 34px;
  font-weight: 800;
  margin: 4px 0 6px;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.hero .sav-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--hero-chip);
  border: 1px solid rgba(255,255,255,0.06);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--hero-mute);
  margin-bottom: 20px;
  backdrop-filter: blur(8px);
}
.hero .sav-pill b { color: var(--hero-ink); }

.hero .month-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.monthNav {
  background: var(--hero-chip);
  color: var(--hero-ink);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  padding: 0;
  font-size: 15px;
  line-height: 1;
  border: 0;
  cursor: pointer;
}
.monthNav:hover:not(:disabled) { background: var(--hero-chip-hover); }
.monthNav:disabled { opacity: 0.3; cursor: not-allowed; }
.hero .pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  background: var(--hero-chip);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--hero-ink);
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
}

.chips { display: flex; gap: 10px; margin-top: 8px; }
.chip {
  flex: 1;
  background: var(--hero-chip);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  backdrop-filter: blur(8px);
}
.chip .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--hero-mute); }
.chip .n { font-weight: 800; font-size: 16px; margin-top: 3px; }
.chip.in-chip .n { color: #34d399; }
.chip.out-chip .n { color: #fb7185; }

/* 6-Month Chart */
.cols {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  height: 110px;
  padding: 8px 4px 4px;
}
.cols div { flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: var(--mute); }
.cols .bar-group { display: flex; justify-content: center; align-items: flex-end; height: 85px; gap: 3px; }
.cols span {
  display: inline-block;
  width: 10px;
  border-radius: 4px 4px 0 0;
  transition: height 0.4s ease, opacity 0.2s;
}
.cols div:hover span { opacity: 0.8; }

/* Category breakdown */
.cat-donut-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0 16px;
}

/* Account Cards */
.acc-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.acc-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.acc-card .badge {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--card-subtle);
  color: var(--mute);
}

/* Transaction Grouping */
.tx-group-header {
  font-size: 12px;
  font-weight: 700;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 16px 4px 8px;
  display: flex;
  justify-content: space-between;
}

/* Bottom Nav */
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
}
@media (prefers-color-scheme: dark) {
  nav { background: rgba(19, 27, 46, 0.9); }
}

nav button {
  flex: 1;
  background: none;
  color: var(--mute);
  border-radius: var(--radius-md);
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  border: 0;
  cursor: pointer;
  transition: all 0.18s ease;
}
nav button svg { width: 22px; height: 22px; stroke-width: 2; transition: transform 0.2s ease; }
nav button:hover { color: var(--ink); }
nav button.on { color: var(--main); }
nav button.on svg { transform: translateY(-2px); stroke-width: 2.3; }

nav button.fab {
  position: relative;
  top: -16px;
  flex: 0 0 auto;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--main), var(--main2));
  color: #fff;
  font-size: 26px;
  box-shadow: var(--shadow-float);
  border: 3px solid var(--card);
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
nav button.fab:hover { transform: scale(1.08) rotate(90deg); }
nav button.fab:active { transform: scale(0.95); }

/* Sheet & Modal */
.sheet-bg {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.18s ease-out;
}
.sheet {
  background: var(--card);
  color: var(--ink);
  width: 100%;
  max-width: 620px;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.15);
  animation: slideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1);
  max-height: 90vh;
  overflow-y: auto;
}
.sheet-handle {
  width: 40px;
  height: 4px;
  border-radius: 99px;
  background: var(--line-strong);
  margin: 0 auto 16px;
  opacity: 0.7;
}
.sheet h3 { margin: 0 0 16px; font-size: 18px; font-weight: 700; }

.theme-opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 12px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: inherit;
  font: inherit;
  -webkit-tap-highlight-color: rgba(37, 99, 235, 0.12);
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.theme-opt * {
  pointer-events: none;
}
.theme-opt:active {
  background: var(--card-subtle);
  transform: scale(0.98);
}
.theme-opt:hover { background: var(--card-subtle); }
.theme-opt .icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--card-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.theme-opt b { font-size: 14.5px; font-weight: 600; display: block; }
.theme-opt .mute { font-size: 12px; margin-top: 1px; }
.swatch { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; border: 2px solid var(--card); box-shadow: var(--shadow-sm); }
.theme-opt .check { margin-left: auto; color: var(--main); font-weight: 800; }

/* Segmented Tabs */
.segTabs {
  display: flex;
  background: var(--card-subtle);
  border-radius: var(--radius-md);
  padding: 3px;
  margin-bottom: 16px;
}
.segTabs button {
  flex: 1;
  background: none;
  color: var(--mute);
  font-weight: 600;
  font-size: 13px;
  padding: 9px 0;
  border-radius: 10px;
  box-shadow: none;
  transition: all 0.15s ease;
}
.segTabs button.on {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

/* Toast */
.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 13.5px;
  z-index: 9999;
  box-shadow: var(--shadow-lg);
  animation: toastSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Currency Bar */
.cur-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  margin-bottom: 12px;
  font-size: 12px;
}
.cur-bar select {
  width: auto;
  margin: 0;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 700;
  border-radius: var(--radius-sm);
}

/* Transaction List Item */
.txitem {
  display: flex;
  align-items: center;
  gap: 12px;
}
.txitem .icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--card-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

/* Scan / File buttons */
.scanBtn {
  width: 100%;
  background: var(--card-subtle);
  color: var(--ink);
  border: 1.5px dashed var(--line-strong);
  padding: 12px;
  border-radius: var(--radius-md);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.scanBtn:hover { border-color: var(--main); background: var(--main-light); color: var(--main); }

/* Loading State */
.loading-box {
  text-align: center;
  padding: 60px 20px;
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--line);
  border-top-color: var(--main);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastSlide { from { transform: translate(-50%, -80%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* ===================================================
   DUITKU OFFICIAL LUXURY SPLASH SCREEN (Frames 01 to 08)
   =================================================== */
:root {
  --splash-bg: #f8fafc;
  --splash-ink: #0f172a;
  --splash-brand: #3956f5;
  --splash-track: rgba(57, 86, 245, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --splash-bg: #090d16;
    --splash-ink: #f8fafc;
    --splash-brand: #4f6bff;
    --splash-track: rgba(255, 255, 255, 0.14);
  }
}
body[data-theme="dark"], body.theme-dark {
  --splash-bg: #090d16;
  --splash-ink: #f8fafc;
  --splash-brand: #4f6bff;
  --splash-track: rgba(255, 255, 255, 0.14);
}

html.no-splash #splash-screen {
  display: none !important;
}

#splash-screen {
  position: fixed;
  inset: 0;
  background: var(--splash-bg);
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}
#splash-screen.splash-exit {
  opacity: 0;
  transform: scale(1.04);
  pointer-events: none;
}
.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: -24px;
}
.splash-logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transform: scale(0.92);
  animation: splashLogoReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
}
@keyframes splashLogoReveal {
  0% { opacity: 0; transform: scale(0.90); filter: blur(4px); }
  40% { opacity: 0.45; transform: scale(0.96); filter: blur(1px); } /* Frame 02 */
  100% { opacity: 1; transform: scale(1); filter: blur(0); } /* Frame 03 */
}
.splash-duitku-icon {
  width: 88px;
  height: 88px;
  border-radius: 22px;
  box-shadow: 0 16px 36px rgba(57, 86, 245, 0.30), 0 2px 8px rgba(0, 0, 0, 0.06);
  display: block;
  margin-bottom: 14px;
}
.splash-brand-text {
  font-size: 30px;
  font-weight: 800;
  color: var(--splash-ink);
  letter-spacing: -1.2px;
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 2px;
}
.splash-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--splash-brand);
  display: inline-block;
  margin-left: 2px;
  animation: splashDotPulse 1.2s ease-in-out infinite;
}
@keyframes splashDotPulse {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 12px rgba(57, 86, 245, 0.6); }
}
.splash-tagline {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #64748b;
  margin-top: 8px;
  opacity: 0;
  animation: splashTaglineFade 0.5s ease-out 0.4s forwards;
}
@keyframes splashTaglineFade {
  to { opacity: 0.85; transform: translateY(0); }
  from { opacity: 0; transform: translateY(4px); }
}
.splash-loader-bar {
  margin-top: 26px;
  width: 64px;
  height: 3px;
  border-radius: 99px;
  background: var(--splash-track);
  overflow: hidden;
  position: relative;
  opacity: 0;
  animation: splashBarFadeIn 0.3s ease-out 0.55s forwards; /* Frame 04 */
}
@keyframes splashBarFadeIn {
  to { opacity: 1; }
}
.splash-loader-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 0%;
  background: var(--splash-brand);
  border-radius: 99px;
  animation: splashProgress 1.1s cubic-bezier(0.45, 0, 0.15, 1) 0.65s forwards; /* Frames 05-07 */
}
@keyframes splashProgress {
  0% { width: 0%; }
  35% { width: 38%; }
  70% { width: 78%; }
  95% { width: 94%; }
  100% { width: 100%; }
}
.splash-home-indicator {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  border-radius: 100px;
  background: var(--splash-ink);
  opacity: 0.22;
}

/* Profile Avatar */
.user-avatar-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
}
.user-avatar-btn:hover {
  transform: scale(1.06);
}
.user-avatar-btn:active {
  transform: scale(0.96);
}
.avatar-preset-btn {
  transition: transform 0.15s ease, background 0.15s ease;
}
.avatar-preset-btn:hover {
  transform: scale(1.15);
  background: var(--card-hover) !important;
}


/* === FINTECH UI UPGRADE === */
.type-toggle-group {
  display: flex;
  background: var(--card-subtle);
  border-radius: var(--radius-md);
  padding: 4px;
  gap: 4px;
  margin: 8px 0 12px;
  border: 1px solid var(--line);
}
.type-btn {
  flex: 1;
  background: transparent;
  color: var(--mute);
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: none;
}
.type-btn:hover {
  color: var(--ink);
  background: rgba(0, 0, 0, 0.03);
}
.type-btn.active.exp-btn {
  background: var(--card);
  color: var(--out);
  box-shadow: var(--shadow-sm);
}
.type-btn.active.inc-btn {
  background: var(--card);
  color: var(--in);
  box-shadow: var(--shadow-sm);
}
.type-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.exp-btn .type-dot { background: var(--out); }
.inc-btn .type-dot { background: var(--in); }

/* Grouped Date Transaction Container */
.tx-group-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.tx-group-card:hover {
  border-color: var(--line-strong);
  box-shadow: var(--shadow-md);
}
.tx-group-header {
  padding: 12px 16px 10px;
  background: var(--card-subtle);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 700;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tx-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px;
  gap: 12px;
  transition: background 0.15s ease;
  position: relative;
}
.tx-row:not(:last-child) {
  border-bottom: 1px solid var(--line);
}
.tx-row:hover {
  background: var(--card-subtle);
}
.tx-row:active {
  background: var(--card-hover);
}

/* Category Quick Chip Enhanced */
.cat-chip {
  flex: 0 0 auto;
  background: var(--card-subtle);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.cat-chip:hover {
  border-color: var(--main);
  transform: translateY(-1px);
}
.cat-chip.active {
  background: var(--main);
  border-color: var(--main);
  color: #fff;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
}

/* Enhanced Scan Banner */
.scan-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.08) 0%, rgba(99, 102, 241, 0.12) 100%);
  border: 1.5px dashed var(--main);
  border-radius: var(--radius-md);
  margin: 6px 0 10px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.scan-banner:hover {
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.14) 0%, rgba(99, 102, 241, 0.18) 100%);
  transform: translateY(-1px);
}
.scan-banner:active {
  transform: scale(0.99);
}

/* Quick Action Tiles */
.quick-action-tile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  border: 1px solid var(--line);
}
.quick-action-tile:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.quick-action-tile:active {
  transform: translateY(0);
}
.quick-action-tile.primary {
  background: linear-gradient(135deg, var(--main), var(--main2));
  color: #fff;
  border: 0;
}
.quick-action-tile.secondary {
  background: var(--card);
  color: var(--ink);
}
.quick-action-tile .qa-icon {
  font-size: 20px;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.quick-action-tile.secondary .qa-icon {
  background: var(--card-subtle);
}
.quick-action-tile b {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.2;
}
.quick-action-tile .qa-sub {
  font-size: 11px;
  opacity: 0.8;
  display: block;
  margin-top: 2px;
}

/* Financial Insights Card */
.insights-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.insights-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(to bottom, var(--main), var(--main2));
}
.insights-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--main-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.pill-badge {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--card-subtle);
  border: 1px solid var(--line);
  color: var(--ink-secondary);
}

/* Account Card Digital Styling */
.acc-card-chip {
  width: 30px;
  height: 22px;
  border-radius: 4px;
  background: linear-gradient(135deg, #d4af37 0%, #f5d77f 100%);
  border: 1px solid rgba(0, 0, 0, 0.12);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

/* Bottom Nav Indicator Dot */
nav button {
  position: relative;
}
nav button.on::after {
  content: '';
  position: absolute;
  bottom: 2px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--main);
}

/* ====== PRINT MODAL & PREVIEW ====== */
#duitkuPrintModal {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}

.print-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.print-modal-container {
  position: relative;
  background: #ffffff;
  color: #0f172a;
  border-radius: 14px;
  max-width: 860px;
  width: 100%;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
  z-index: 1;
  overflow: hidden;
}

.print-actions-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
}

.printable-sheet {
  padding: 24px;
  overflow-y: auto;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.4;
  color: #0f172a;
  background: #fff;
}

@media print {
  body > *:not(#duitkuPrintModal) {
    display: none !important;
  }
  #duitkuPrintModal {
    position: static !important;
    inset: auto !important;
    padding: 0 !important;
    overflow: visible !important;
    display: block !important;
    background: transparent !important;
  }
  .print-modal-backdrop, .print-actions-bar, .no-print {
    display: none !important;
  }
  .print-modal-container {
    max-width: 100% !important;
    max-height: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    overflow: visible !important;
  }
  .printable-sheet {
    padding: 0 !important;
    overflow: visible !important;
  }
}
</style>

// ====== TOAST ======
function toast(msg, type = 'info') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.backgroundColor = type === 'error' ? 'var(--out)' : type === 'success' ? 'var(--in)' : 'var(--ink)';
  const icon = type === 'error' ? '⚠️ ' : type === 'success' ? '✓ ' : 'ℹ️ ';
  t.innerText = icon + msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translate(-50%, -15px)';
    t.style.transition = 'all 0.2s';
    setTimeout(() => t.remove(), 200);
  }, 2800);
}

}

function computeBalances() {
  BAL_CACHE = {};
  S.acc.forEach(a => { BAL_CACHE[a.id] = +a.balance; });

    }
  });
}

// ====== INLINE MATH CALCULATOR ======
function evalMathExpr(expr) {
  if (!expr) return null;
  const s = String(expr).trim();
  if (!/[\+\-\*\/]/.test(s)) return null;
  const sanitized = s.replace(/\./g, '').replace(/,/g, '.');
  if (!/^[\d\s\.\+\-\*\/]+$/.test(sanitized)) return null;
  try {
    const val = Function(`'use strict'; return (${sanitized})`)();
    if (typeof val === 'number' && !isNaN(val) && isFinite(val) && val >= 0) {
      return Math.round(val);
    }
  } catch(e) {}
  return null;
}

function formatInputCurrency(inputEl) {
  if (!inputEl) return;
  
  let badge = inputEl.nextElementSibling;
  if (!badge || !badge.classList.contains('math-calc-badge')) {
    badge = document.createElement('div');
    badge.className = 'math-calc-badge';
    badge.style.cssText = 'font-size:11.5px;color:var(--main);font-weight:600;margin-top:-6px;margin-bottom:8px;display:none;background:var(--card-subtle);padding:4px 8px;border-radius:6px';
    inputEl.parentNode.insertBefore(badge, inputEl.nextSibling);
  }

  inputEl.addEventListener('input', function() {
    const raw = this.value;
    const calcResult = evalMathExpr(raw);
    if (calcResult !== null) {
      badge.style.display = 'block';
      badge.innerHTML = `🧮 Hasil hitung: <b>${rp(calcResult)}</b> (Tekan Enter/Selesai untuk menerapkan)`;
      return;
    } else {
      badge.style.display = 'none';
    }

    let cursorPosition = this.selectionStart;
    let val = this.value.replace(/[^0-9]/g, '');
    if (val === '') { this.value = ''; return; }
    let formatted = parseInt(val, 10).toLocaleString('id-ID');
    let diff = formatted.length - this.value.length;
    this.value = formatted;
    this.setSelectionRange(cursorPosition + diff, cursorPosition + diff);
  });

  inputEl.addEventListener('blur', function() {
    const calcResult = evalMathExpr(this.value);
    if (calcResult !== null) {
      this.value = calcResult.toLocaleString('id-ID');
      badge.style.display = 'none';
      this.dispatchEvent(new Event('input'));
    }
  });

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const calcResult = evalMathExpr(this.value);
      if (calcResult !== null) {
        e.preventDefault();
        this.value = calcResult.toLocaleString('id-ID');
        badge.style.display = 'none';
        this.dispatchEvent(new Event('input'));
      }
    }
  });
}

function compressImageToAvatar(file, targetSize = 200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = targetSize;
        canvas.height = targetSize;
        const ctx = canvas.getContext('2d');
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, targetSize, targetSize);
        try {
          resolve(canvas.toDataURL('image/webp', 0.85));
        } catch(err) {
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadProfilePhoto(file) {
  if (!file) return;
  if (!CURRENT_USER) return toast('Harap login terlebih dahulu', 'warn');
  
  const statusEl = document.getElementById('pf_avatar_status');
  if (statusEl) statusEl.innerHTML = '<span class="mute">⏳ Mengompres & mengunggah foto...</span>';
  
  try {
    const compressedDataUrl = await compressImageToAvatar(file, 200);
    let finalAvatarUrl = compressedDataUrl;

    try {
      const blob = await (await fetch(compressedDataUrl)).blob();
      const ext = 'webp';
      const filePath = `${CURRENT_USER.id}/avatar-${Date.now()}.${ext}`;
      const { data: stData, error: stErr } = await sb.storage.from('avatars').upload(filePath, blob, {
        upsert: true,
        contentType: 'image/webp'
      });
      if (!stErr) {
        const { data: pubData } = sb.storage.from('avatars').getPublicUrl(filePath);
        if (pubData && pubData.publicUrl) finalAvatarUrl = pubData.publicUrl;
      }
    } catch(stCatch) {
      console.warn('Storage bucket fallback:', stCatch);
    }

    const { data: authData, error: authErr } = await sb.auth.updateUser({
      data: { avatar_url: finalAvatarUrl }
    });
    if (authErr) throw authErr;

    try {
      await sb.from('profiles').upsert({
        id: CURRENT_USER.id,
        avatar_url: finalAvatarUrl,
        username: (CURRENT_USER.user_metadata && CURRENT_USER.user_metadata.username) || '',
        updated_at: new Date().toISOString()
      });
    } catch(e) {}

    CURRENT_USER = authData.user;
    saveToLocalCache();
    toast('Foto profil berhasil diperbarui!', 'success');
    render();
  } catch(err) {
    console.error('Upload avatar error:', err);
    toast('Gagal mengunggah foto: ' + err.message, 'error');
  } finally {
    if (statusEl) statusEl.innerHTML = '';
  }
}

async function load(skipRecurring) {
  try {
    const [a, t, i, sv, mv, bu, rc] = await Promise.all([
      sb.from('accounts').select('*').order('created_at'),
      sb.from('transactions').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }),
      sb.from('installments').select('*').order('created_at'),
      sb.from('savings').select('*').order('created_at'),
      sb.from('saving_moves').select('*').order('created_at'),
      sb.from('budgets').select('*').order('created_at'),
      sb.from('recurring').select('*').order('created_at')
    ]);
    S.acc = a.data || []; S.tx = t.data || []; S.inst = i.data || []; S.sav = sv.data || []; S.mv = mv.data || [];
    S.bud = bu.data || []; S.rec = rc.data || [];
    computeBalances();
    saveToLocalCache();
    if (!skipRecurring && await runRecurring()) return load(true);
    render();
    safeDismissSplash();
  } catch(err) {
    console.error(err);
    render();
    safeDismissSplash();
  }
}

async function runRecurring() {
  if (!S.rec.length) return false;
  const nowYm = ym(new Date()), todayDate = new Date().getDate();
  const toInsert = [];
  const toUpdate = [];

  for (const r of S.rec) {
    if (r.last_run === nowYm || todayDate < r.day_of_month) continue;
    const date = nowYm + '-' + String(r.day_of_month).padStart(2, '0');
    toInsert.push({ account_id: r.account_id, type: r.type, amount: r.amount, category: r.category, note: (r.note ? r.note + ' · ' : '') + 'Otomatis: ' + r.name, date });
    toUpdate.push(r.id);
  }

  if (toInsert.length) {
    await sb.from('transactions').insert(toInsert);
    for (const rid of toUpdate) {
      await sb.from('recurring').update({ last_run: nowYm }).eq('id', rid);
    }
    return true;
  }
  return false;
}

function recoveryHtml() {
  return `<div class="wrap" style="padding-top:40px">
    <h1>Atur Kata Sandi Baru</h1>
    <div class="card">
      <div class="mute" style="margin-bottom:12px">Link reset terverifikasi. Masukkan kata sandi baru Anda:</div>
      <input id="rc_pw1" type="password" placeholder="Password baru (min. 6 karakter)" autocomplete="new-password">
      <input id="rc_pw2" type="password" placeholder="Ulangi password baru" autocomplete="new-password">
      <button style="width:100%;margin-top:10px" onclick="finishRecovery()">Simpan Password Baru</button>
    </div>
  </div>`;
}

async function sendReset() {
  const email = v('fp_email').trim();
  if (!email) return alert('Isi email kamu.');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if (error) return alert(error.message);
  toast('Link reset sudah dikirim. Cek inbox (atau folder spam).', 'success');
  showForgot = false; 
  if (!CURRENT_USER) authView(); else render();
}

async function finishRecovery() {
  const p1 = v('rc_pw1'), p2 = v('rc_pw2');
  if (p1.length < 6) return alert('Password minimal 6 karakter.');
  if (p1 !== p2) return alert('Konfirmasi password tidak cocok.');
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) return alert(error.message);
  showRecovery = false; toast('Password berhasil diganti. Anda sudah masuk.', 'success'); load();
}

function needCred() { if (!v('em').trim() || v('pw').length < 6) { alert('Isi email dan kata sandi (min. 6 karakter).'); return true; } }

async function login() {
  if (needCred()) return;
  const email = v('em').trim();
  const { data, error } = await sb.auth.signInWithPassword({ email, password: v('pw') });
  if (error) return alert('Login gagal: ' + error.message);
  CURRENT_USER = data.user; toast('Berhasil masuk', 'success'); load();
}

async function signup() {
  if (needCred()) return;
  const { data, error } = await sb.auth.signUp({ email: v('em').trim(), password: v('pw') });
  if (error) return alert(error.message);
  if (data.session) { CURRENT_USER = data.user; toast('Akun berhasil dibuat', 'success'); load(); } 
  else alert('Cek email kamu untuk konfirmasi pendaftaran, lalu login.');
}

async function logout() { await sb.auth.signOut(); CURRENT_USER = null; showThemeSheet = false; authView(); }

function handleSearch(val) { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { setTxFilter('q', val); }, 250); }
function clearTxFilter() { txFilter = { q: '', cat: '', from: '', to: '' }; render(); }

  if (!S.acc.length) return `<h1>Transaksi</h1><div class="card" style="text-align:center;padding:30px">Belum ada rekening terdaftar. Tambahkan rekening terlebih dahulu lewat tombol <b>+</b> di bawah.</div>`;
  const cats = [...new Set(S.tx.map(t => t.category || 'Lainnya'))].sort();
  let list = S.tx;
  const f = txFilter;
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(t => (t.category || '').toLowerCase().includes(q) || (t.note || '').toLowerCase().includes(q) || accName(t.account_id).toLowerCase().includes(q)); }

  if (f.from) list = list.filter(t => t.date >= f.from);
  if (f.to) list = list.filter(t => t.date <= f.to);
  const active = f.q || f.cat || f.from || f.to;
  
  const filInc = sum(list, 'income'), filExp = sum(list, 'expense');

  // Group by date
  const groups = {};
  list.slice(0, active ? 300 : 80).forEach(t => {
    if (!groups[t.date]) groups[t.date] = [];

  });

  return `<h1>Riwayat Transaksi</h1>

    const dayInc = sum(items, 'income'), dayExp = sum(items, 'expense');
    const dObj = new Date(date + 'T00:00:00');

    return `
      <div class="tx-group-card">
        <div class="tx-group-header">
          <span>${dayLabel} <span class="mute" style="font-size:10.5px;font-weight:500">· ${date}</span></span>

            ${dayInc ? `<span class="in" style="font-weight:700">+${rp(dayInc)}</span>` : ''}
            ${dayExp ? `<span class="out" style="font-weight:700">-${rp(dayExp)}</span>` : ''}
          </span>
        </div>
        ${items.map(t => `
          <div class="tx-row">
            <div class="txitem" style="cursor:pointer;flex:1" onclick="editRow('transactions','${t.id}')">
              <div class="icon">${catIcon(t.category)}</div>
              <div>
                <b style="font-size:14px;color:var(--ink)">${esc(t.category || 'Lainnya')}</b>
                ${t.note ? `<span class="mute" style="font-weight:500"> · ${esc(t.note)}</span>` : ''}

                  <span style="font-weight:600;color:var(--ink-secondary)">${esc(accName(t.account_id))}</span>

function downloadSampleCsv() {

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "template-mutasi-duitku.csv");
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
  const splitLine = line => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else { if (c === '"') q = true; else if (c === ',' || c === ';') { out.push(cur); cur = ''; } else cur += c; }
    }
    out.push(cur); return out.map(s => s.trim());
  };
  const header = splitLine(lines[0]).map(h => h.toLowerCase());
  const rows = [];
  for (let i = 1; i < lines.length; i++) { const cells = splitLine(lines[i]); const obj = {}; header.forEach((h, idx) => obj[h] = cells[idx] ?? ''); rows.push(obj); }
  return rows;
}

async function importCsv(file) {
  if (!file) return;
  const box = $('impStatus');
  box.innerHTML = '<div class="mute" style="margin-top:8px">⏳ Membaca dan menganalisis mutasi CSV...</div>';
  try {
    const text = await file.text();
    const rows = parseCSV(text);
    const col = (o, names) => { for (const n of names) if (o[n] !== undefined && o[n] !== '') return o[n]; return ''; };
    const accCache = {}; S.acc.forEach(a => accCache[a.name.toLowerCase()] = a.id);
    const toInsert = []; let skipped = 0;

    for (const r of rows) {
      let dateRaw = col(r, ['tanggal', 'date']), date = dateRaw;
      const dm = dateRaw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (dm) { let [, d, mo, y] = dm; if (y.length === 2) y = '20' + y; date = y + '-' + mo.padStart(2, '0') + '-' + d.padStart(2, '0'); }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped++; continue; }

      const accNameRaw = col(r, ['rekening', 'account']) || S.acc[0]?.name || '';
      let accId = accCache[accNameRaw.toLowerCase()];
      if (!accId && accNameRaw) {
        const { data, error } = await sb.from('accounts').insert({ name: accNameRaw, balance: 0 }).select().single();
        if (!error && data) { accId = data.id; accCache[accNameRaw.toLowerCase()] = accId; S.acc.push(data); }
      }
      if (!accId) { skipped++; continue; }

      let type = col(r, ['tipe', 'type']).toLowerCase();
      const incAmt = parseAmt(col(r, ['pemasukan', 'income'])), expAmt = parseAmt(col(r, ['pengeluaran', 'expense']));
      let amount = 0;
      if (incAmt > 0) { amount = incAmt; type = 'income'; }
      else if (expAmt > 0) { amount = expAmt; type = 'expense'; }
      else { amount = parseAmt(col(r, ['jumlah', 'amount'])); type = /masuk|income|in\b/i.test(type) ? 'income' : 'expense'; }

      if (!(amount > 0)) { skipped++; continue; }
      toInsert.push({ account_id: accId, type, amount, category: col(r, ['kategori', 'category']) || null, note: col(r, ['catatan', 'note']) || null, date });
    }

    if (toInsert.length) await run(sb.from('transactions').insert(toInsert));
    box.innerHTML = '';
    toast(`✅ Berhasil impor ${toInsert.length} transaksi${skipped ? ` (${skipped} dilewati)` : ''}`, 'success');
    load();
  } catch (e) {
    box.innerHTML = '<div class="mute" style="margin-top:8px;color:var(--out)">⚠️ Format file CSV tidak didukung atau terjadi kesalahan pembacaan.</div>';
  }
}

// ====== HELPER DECIMAL & CURRENCY PARSER (ANTI SALAH 20.000,00 JADI 2 JUTA) ======
function parseReceiptAmount(rawStr) {
  if (!rawStr) return 0;
  let s = String(rawStr).trim();
  s = s.replace(/^[rR][pP]\.?\s*/g, '');
  s = s.replace(/\s*,-$/g, '');
  
  // Kasus desimal 2 digit di ujung: cth ",00" atau ".00" atau ",50"
  const mDec2 = s.match(/[,.](\d{2})$/);
  if (mDec2) {
    const cents = mDec2[1];
    const mainPart = s.slice(0, -3).replace(/[.,]/g, '');
    if (cents === '00') {
      return parseFloat(mainPart) || 0;
    } else {
      return parseFloat(mainPart + '.' + cents) || 0;
    }
  }

  // Kasus desimal 1 digit di ujung: cth ",0" atau ".0"
  const mDec1 = s.match(/[,.](\d{1})$/);
  if (mDec1) {
    const cents = mDec1[1];
    const mainPart = s.slice(0, -2).replace(/[.,]/g, '');
    return parseFloat(mainPart + '.' + cents) || 0;
  }

  // Format ribuan biasa (cth: 20.000 atau 20,000 atau 20000)
  const cleaned = s.replace(/[.,]/g, '');
  return parseFloat(cleaned) || 0;
}

// Convert File to Base64
async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ====== PRE-PROCESSING GAMBAR STRUK VIA HTML5 CANVAS (UNTUK LOCAL OCR) ======
async function preprocessReceiptImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let width = img.width, height = img.height;
        const maxDim = 1400;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        try {
          const imgData = ctx.getImageData(0, 0, width, height);
          const d = imgData.data;
          let totalLuma = 0;
          for (let i = 0; i < d.length; i += 4) {
            totalLuma += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          }
          const avgLuma = totalLuma / (d.length / 4);
          const threshold = Math.min(210, Math.max(90, avgLuma * 0.90));

          for (let i = 0; i < d.length; i += 4) {
            const luma = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            const val = luma < threshold ? 0 : 255;
            d[i] = val;
            d[i + 1] = val;
            d[i + 2] = val;
          }
          ctx.putImageData(imgData, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        } catch(err) {
          resolve(file);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ====== DUAL ENGINE OCR SCANNER (AI GEMINI VISION + HIGH-ACCURACY LOCAL) ======
async function scanReceipt(file, p) {
  p = p || 'qt_';
  if (!file) return;
  const setBox = (html) => {
    const box = $('scanStatus');
    if (box) box.innerHTML = html;
  };

  // ENGINE 1: GOOGLE GEMINI AI VISION (JIKA API KEY TERSEDIA)
  if (GEMINI_API_KEY) {
    setBox('<div class="mute" style="margin:8px 0">✨ Mengirim gambar ke Google Gemini AI Vision...</div>');
    try {
      const base64Data = await fileToBase64(file);
      const mimeType = file.type || 'image/jpeg';
      const cleanBase64 = base64Data.split(',')[1];

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      const prompt = `Analisis struk belanja Indonesia ini secara teliti.
Ekstrak data berikut dalam format JSON murni:
{
  "total": <angka total akhir yang harus dibayar, berupa integer tanpa sen jika ,00, contoh 20000>,
  "date": <tanggal transaksi format YYYY-MM-DD, atau kosong jika tidak ada>,
  "merchant": <nama toko atau restoran>,
  "category": <pilih salah satu kategori: Makan, Transport, Belanja, Kesehatan, Tagihan, Hiburan, Lainnya>
}
PENTING:
- Bedakan antara TOTAL AKHIR / TOTAL BELANJA dengan TUNAI/CASH (uang yang dibayarkan pembeli) dan KEMBALIAN/CHANGE. Ambil TOTAL AKHIR belanja.
- Hati-hati dengan format desimal: jika tertulis "20.000,00" atau "20000,00" maka totalnya adalah 20000 (bukan 2 juta!).
Hanya kembalikan JSON murni tanpa markdown triple backticks.`;

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inlineData: { mimeType, data: cleanBase64 } }
            ]
          }]
        })
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        throw new Error(errJson.error?.message || `HTTP ${response.status}`);
      }

      const resData = await response.json();
      const rawAnswer = resData.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const cleanJson = rawAnswer.replace(/```json/g, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(cleanJson);

      const totalVal = Math.round(Number(parsed.total) || 0);
      const merchantVal = (parsed.merchant || '').trim();
      const dateVal = (parsed.date || '').trim();
      const catVal = (parsed.category || '').trim();

      if (totalVal > 0) {
        const amtEl = $(p + 'amt');
        if (amtEl) {
          amtEl.value = String(totalVal);
          amtEl.dispatchEvent(new Event('input'));
        }
      }
      const noteEl = $(p + 'note');
      if (noteEl && merchantVal) noteEl.value = merchantVal.slice(0, 50);
      const dateEl = $(p + 'date');
      if (dateEl && dateVal && /^\d{4}-\d{2}-\d{2}$/.test(dateVal)) dateEl.value = dateVal;
      const catEl = $(p + 'cat');
      if (catEl && catVal) catEl.value = catVal;

      setBox(`<div class="mute" style="margin:6px 0;color:var(--in)">
        ✨ <b>Dianalisis Sempurna oleh Gemini AI!</b><br>
        Total: <b>${rp(totalVal)}</b> ${catVal ? `· Kategori: <b>${catVal}</b>` : ''} ${merchantVal ? `· Toko: <b>${esc(merchantVal)}</b>` : ''}
      </div>`);
      return;
    } catch(aiErr) {
      console.warn('Gemini AI Vision gagal, beralih ke local OCR:', aiErr);
      setBox(`<div class="mute" style="margin:6px 0;color:var(--warn)">⚠️ AI API gagal (${aiErr.message || 'Error'}), beralih ke scanner lokal...</div>`);
    }
  }

  // ENGINE 2: LOCAL HIGH-ACCURACY OCR DENGAN PERBAIKAN DESIMAL (ANTI-SALAH 20.000,00 JADI 2 JUTA)
  setBox('<div class="mute" style="margin:8px 0">⏳ Mempersiapkan scanner struk lokal...</div>');
  try { 
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js', 'Tesseract'); 
  } catch (e) { 
    setBox('<div class="mute" style="margin:8px 0;color:var(--out)">⚠️ Gagal memuat library scanner OCR. Periksa koneksi internet Anda.</div>'); 
    return; 
  }

  try {
    const tess = window.Tesseract;
    if (!tess || typeof tess.recognize !== 'function') {
      throw new Error('Library Tesseract belum siap.');
    }
    const processedImg = await preprocessReceiptImage(file);
    const { data } = await tess.recognize(processedImg, 'ind+eng', {
      logger: m => {
        if (m.status === 'recognizing text' && m.progress !== undefined) {
          setBox(`<div class="mute" style="margin:8px 0">🔍 Memindai teks struk... <b>${Math.round(m.progress * 100)}%</b></div>`);
        }
      }
    });

    const rawText = data.text || '';
    const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);

    // Helper ekstrak nominal dengan fungsi parseReceiptAmount anti-salah desimal
    const extractNums = (str) => {
      const matches = str.match(/(\d[\d.,]{2,})/g) || [];
      const res = [];
      for (const m of matches) {
        const val = parseReceiptAmount(m);
        if (val >= 100 && val <= 100000000) {
          res.push(val);
        }
      }
      return res;
    };

    let bestTotal = 0;

    // Prioritas 1: Baris Grand Total / Total Akhir / Total Belanja / Tagihan
    for (const l of lines) {
      const low = l.toLowerCase();
      if (/(grand\s*total|total\s*akhir|total\s*belanja|total\s*bayar|total\s*tagihan|tagihan|amount\s*due|total\s*harga|harga\s*total)/i.test(low)) {
        const nums = extractNums(l);
        if (nums.length) {
          bestTotal = nums[nums.length - 1];
          break;
        }
      }
    }

    // Prioritas 2: Baris TOTAL murni
    if (!bestTotal) {
      for (const l of lines) {
        const low = l.toLowerCase();
        if (/\btotal\b/i.test(low) && !/(subtotal|kembali|change|kembalian|tunai|cash|bayar)/i.test(low)) {
          const nums = extractNums(l);
          if (nums.length) {
            bestTotal = nums[nums.length - 1];
            break;
          }
        }
      }
    }

    // Prioritas 3: Baris Subtotal
    if (!bestTotal) {
      for (const l of lines) {
        const low = l.toLowerCase();
        if (/subtotal|sub\s*total/i.test(low)) {
          const nums = extractNums(l);
          if (nums.length) {
            bestTotal = nums[nums.length - 1];
            break;
          }
        }
      }
    }

    // Prioritas 4: Fallback
    if (!bestTotal) {
      const candidates = [];
      for (const l of lines) {
        const low = l.toLowerCase();
        if (!/(kembali|change|kembalian|tunai|cash|debit|kartu|card|saldo|telp|pajak|ppn)/i.test(low)) {
          const nums = extractNums(l);
          candidates.push(...nums);
        }
      }
      if (candidates.length) {
        bestTotal = Math.max(...candidates);
      }
    }

    // Deteksi Tanggal Struk
    let dateVal = '';
    const dateMatch = rawText.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
    if (dateMatch) {
      let [, d, mo, y] = dateMatch;
      if (y.length === 2) y = '20' + y;
      if (+d <= 31 && +mo <= 12) {
        dateVal = y + '-' + mo.padStart(2, '0') + '-' + d.padStart(2, '0');
      }
    }

    // Deteksi Toko / Merchant
    let merchant = '';
    for (let i = 0; i < Math.min(5, lines.length); i++) {
      const lineCandidate = lines[i].replace(/[^\w\s\.-]/g, '').trim();
      if (lineCandidate.length >= 3 && !/^\d/.test(lineCandidate) && !/(struk|receipt|selamat|nota|bukti|pembayaran)/i.test(lineCandidate)) {
        merchant = lineCandidate;
        break;
      }
    }

    // Deteksi Kategori
    let detectedCat = '';
    const lowerText = rawText.toLowerCase();
    if (/indomaret|alfamart|alfamidi|superindo|hypermart|transmart|lotte|circle\s*k|familymart|lawson|miniso|uniqlo|guardian|watsons?|century/i.test(lowerText)) {
      detectedCat = 'Belanja';
    } else if (/kfc|mcd|mcdonald|burger\s*king|hokben|starbucks|janji\s*jiwa|kopi\s*kenangan|chatime|mixue|fore|solaria|dapur\s*solo|mie\s*gacoan|pizza\s*hut|domino|richeese|bakso|soto|warung|resto|cafe|coffee|dapur|bakery|roti/i.test(lowerText)) {
      detectedCat = 'Makan';
    } else if (/spbu|pertamina|shell|bp\b|parkir|parking|toll|jasamarga|jasa\s*marga|bensin|pertalite|pertamax|solar|grab|gojek|maxim/i.test(lowerText)) {
      detectedCat = 'Transport';
    } else if (/apotek|kimia\s*farma|k-?24|klinik|rumah\s*sakit|hospital|dokter|optik|prodia|laboratorium/i.test(lowerText)) {
      detectedCat = 'Kesehatan';
    } else if (/pln|listrik|pdam|indihome|biznet|telkom|bpjs|pulsa|token/i.test(lowerText)) {
      detectedCat = 'Tagihan';
    } else if (/cinema\s*21|xxi|cgv|cinepolis|timezone|steam|netflix|spotify/i.test(lowerText)) {
      detectedCat = 'Hiburan';
    }

    if (bestTotal) {
      const amtEl = $(p + 'amt');
      if (amtEl) {
        amtEl.value = String(Math.round(bestTotal));
        amtEl.dispatchEvent(new Event('input'));
      }
    }
    const noteEl = $(p + 'note');
    if (noteEl && merchant) noteEl.value = merchant.slice(0, 50);
    const dateEl = $(p + 'date');
    if (dateEl && dateVal) dateEl.value = dateVal;
    const catEl = $(p + 'cat');
    if (catEl && detectedCat) catEl.value = detectedCat;

    setBox((bestTotal ? 
      `<div class="mute" style="margin:6px 0;color:var(--in)">
        ✓ <b>Terdeteksi (OCR Lokal)!</b><br>
        Nominal: <b>${rp(bestTotal)}</b> ${detectedCat ? `· Kategori: <b>${detectedCat}</b>` : ''} ${merchant ? `· Toko: <b>${esc(merchant)}</b>` : ''}
        <div style="font-size:11px;color:var(--mute);margin-top:2px">💡 Tips: Aktifkan API Key Gemini (gratis) untuk akurasi 100% tanpa salah baca.</div>
      </div>` : 
      `<div class="mute" style="margin:6px 0;color:var(--warn)">
        ⚠️ Angka total belum terdeteksi otomatis, silakan ketik manual.
      </div>`
    ) + `<details style="margin-top:6px">
      <summary class="mute" style="cursor:pointer;font-size:11.5px">Lihat hasil teks OCR mentah</summary>
      <div style="max-height:100px;overflow-y:auto;background:var(--card-subtle);padding:8px;border-radius:8px;font-size:11px;white-space:pre-wrap;margin-top:4px">${esc(rawText || '(Teks kosong)')}</div>
    </details>`);

  } catch (err) {
    console.error(err);
    setBox('<div class="mute" style="margin:6px 0;color:var(--out)">⚠️ Gagal memindai struk. Silakan isi form secara manual.</div>');
  }
}

  if (await run(q)) { showAddSheet = false; addMode = null; editing = null; toast('Transaksi rutin berhasil disimpan', 'success'); load(); }
}

async function addTransfer(evt) {
  const from = v('qf_from'), to = v('qf_to');
  if (!from || !to || from === to) return toast('Pilih dua rekening yang berbeda.', 'warn');
  const amt = inIDR('qf_amt'); 
  if (amt === null || !(amt > 0)) return toast('Isi nominal transfer yang valid.', 'warn');
  const note = v('qf_note').trim(), date = v('qf_date') || today();
  const fromAcc = S.acc.find(a => a.id === from), toAcc = S.acc.find(a => a.id === to);
  
  const targetBtn = (evt && evt.target && evt.target.tagName === 'BUTTON') ? evt.target : document.querySelector('button[onclick*="addTransfer"]');
  if (targetBtn) { targetBtn.disabled = true; targetBtn.innerText = 'Memproses transfer...'; }
  try {
    const ok1 = await run(sb.from('transactions').insert({ account_id: from, type: 'expense', amount: amt, category: 'Transfer', note: 'Ke ' + (toAcc ? toAcc.name : '') + (note ? ' - ' + note : ''), date }));
    const ok2 = ok1 && await run(sb.from('transactions').insert({ account_id: to, type: 'income', amount: amt, category: 'Transfer', note: 'Dari ' + (fromAcc ? fromAcc.name : '') + (note ? ' - ' + note : ''), date }));
    if (ok2) { 
      showAddSheet = false; 
      addMode = null; 
      toast('Transfer saldo berhasil!', 'success'); 
      load(); 
    }
  } finally {
    if (targetBtn) { targetBtn.disabled = false; targetBtn.innerText = 'Konfirmasi Transfer'; }
  }
}

async function addAcc(p) {
  p = p || 'a_';
  if (!v(p + 'name')) return alert('Isi nama rekening.');
  const bal = inIDR(p + 'bal'); if (bal === null) return;
  const payload = { name: v(p + 'name'), balance: bal };
  const isEdit = editing && editing.table === 'accounts';
  const q = isEdit ? sb.from('accounts').update(payload).eq('id', editing.id) : sb.from('accounts').insert(payload);
  if (await run(q)) { if (p[0] === 'q') { showAddSheet = false; addMode = null; editing = null; } toast('Rekening berhasil disimpan', 'success'); load(); }
}

async function addTx(p) {
  p = p || 't_';
  const amt = inIDR(p + 'amt'); if (amt === null) return;
  if (!(amt > 0)) return alert('Isi nominal transaksi.');
  const payload = { account_id: v(p + 'acc'), type: v(p + 'type'), amount: amt, category: v(p + 'cat') || null, note: v(p + 'note') || null, date: v(p + 'date') || today() };
  const isEdit = editing && editing.table === 'transactions';
  const q = isEdit ? sb.from('transactions').update(payload).eq('id', editing.id) : sb.from('transactions').insert(payload);
  if (await run(q)) { if (p[0] === 'q') { showAddSheet = false; addMode = null; editing = null; } toast('Transaksi tersimpan', 'success'); load(); }
}

async function addInst(p) {
  p = p || 'i_';
  const mo = inIDR(p + 'amt'); if (mo === null) return;
  if (!v(p + 'name') || !(mo > 0) || !(+v(p + 'tot') > 0)) return alert('Lengkapi data cicilan.');
  const payload = { account_id: v(p + 'acc'), name: v(p + 'name'), monthly_amount: mo, total_months: +v(p + 'tot'), paid_months: Math.min(+v(p + 'paid') || 0, +v(p + 'tot')) };
  const isEdit = editing && editing.table === 'installments';
  const q = isEdit ? sb.from('installments').update(payload).eq('id', editing.id) : sb.from('installments').insert(payload);
  if (await run(q)) { if (p[0] === 'q') { showAddSheet = false; addMode = null; editing = null; } toast('Cicilan berhasil disimpan', 'success'); load(); }
}

async function saveUsername() {
  const name = v('pf_uname').trim();
  if (!name) return alert('Isi username.');
  const { data, error } = await sb.auth.updateUser({ data: { username: name } });
  if (error) return alert(error.message);
  CURRENT_USER = data.user; toast('Username berhasil disimpan', 'success'); render();
}

async function changePassword() {
  const p1 = v('pf_pw1'), p2 = v('pf_pw2');
  if (p1.length < 6) return alert('Password baru minimal 6 karakter.');
  if (p1 !== p2) return alert('Konfirmasi password baru tidak cocok.');
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) return alert(error.message);
  $('pf_pw1').value = ''; $('pf_pw2').value = ''; toast('Kata sandi berhasil diperbarui', 'success');
}

async function pay(id) {
  const i = S.inst.find(x => x.id === id);
  if (!i || i.paid_months >= i.total_months) return;
  if (!confirm(`Bayar cicilan ${i.name} sebesar ${rp(i.monthly_amount)} dari ${accName(i.account_id)}?`)) return;
  const ok = await run(sb.from('transactions').insert({ account_id: i.account_id, installment_id: i.id, type: 'expense', amount: i.monthly_amount, category: 'Cicilan', note: i.name, date: today() }));
  if (ok && await run(sb.from('installments').update({ paid_months: i.paid_months + 1 }).eq('id', id))) { toast('Cicilan bulan ini berhasil dibayar', 'success'); load(); }
}

async function del(table, id) {
  if (!confirm('Hapus data ini secara permanen?')) return;
  if (await run(sb.from(table).delete().eq('id', id))) { toast('Data telah dihapus', 'success'); load(); }
}

fetchRates();
initSupabase();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
